const sfx=(()=>{let C=null,M=null;const on=()=>st.snd!==0;

  function env(g,t,a,d,v){g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+a+d)}
  function tone(fr,t,d,type,v,f2){const o=C.createOscillator(),g=C.createGain();o.type=type||"sine";o.frequency.setValueAtTime(fr,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);env(g,t,.005,d,v||.3);o.connect(g);g.connect(M);o.start(t);o.stop(t+d+.05)}
  function noise(t,d,v,fr,q){const n=C.sampleRate*d|0,b=C.createBuffer(1,n,C.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=Math.random()*2-1;const s=C.createBufferSource();s.buffer=b;const fl=C.createBiquadFilter();fl.type="bandpass";fl.frequency.value=fr||1200;fl.Q.value=q||1;const g=C.createGain();env(g,t,.005,d,v||.3);s.connect(fl);fl.connect(g);g.connect(M);s.start(t)}
  const w=fn=>(...a)=>{if(!on())return;unlock();if(!C)return;try{fn(C.currentTime,...a)}catch(e){}};
  return{unlock,
    fall:w(t=>{tone(160,t+.85,.25,"sine",.6,45);noise(t+.85,.15,.4,300,.7);noise(t,.8,.08,700,.5)}),
    shake:w(t=>{for(let i=0;i<7;i++)noise(t+i*.06,.05,.25,2500+Math.random()*1500,2)}),
    burst:w(t=>{noise(t,.5,.35,1800,.4);[523,659,784,1047,1319].forEach((fr,i)=>tone(fr,t+.05+i*.06,.35,"triangle",.18))}),
    tick:w((t,v)=>{tone(1300+Math.random()*300,t,.04,"square",.05+(v||1)*.06)}),
    win:w((t,r)=>{[523,659,784,1047,1319,1568].slice(0,3+(r|0)).forEach((fr,i)=>{tone(fr,t+i*.09,.5,"triangle",.22);tone(fr*2,t+i*.09,.35,"sine",.08)})}),
